name: Sonda compiladores antigos
on:
  push:
    branches: [debug-crash]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
    - run: |
        curl -s 'https://hub.docker.com/v2/repositories/devkitpro/devkitppc/tags?page_size=100' | jq -r '.results[].name' > tags.txt
        echo "SONDA tags: $(tr '\n' ' ' < tags.txt)"
        printf '%s\n' '#include <paired.h>' 'typedef float v __attribute__((vector_size(8)));' 'v f(v a, v b, v c){ return __builtin_paired_madds0(a,b,c); }' > p.c
        for t in $(grep -E '^(2018|2019|2020)' tags.txt | sort | head -12); do
          docker pull -q devkitpro/devkitppc:$t >/dev/null || continue
          docker run --rm -v $PWD:/w -w /w devkitpro/devkitppc:$t sh -c 'CC=/opt/devkitpro/devkitPPC/bin/powerpc-eabi-gcc; V=$($CC -dumpversion); if $CC -mcpu=750 -meabi -mrvl -mpaired -O2 -S p.c -o - 2>err | grep -q ps_madds0; then echo "SONDA OK gcc $V"; else echo "SONDA NAO gcc $V: $(head -1 err)"; fi' 2>&1 | sed "s/SONDA/SONDA $t/"
          docker rmi -f devkitpro/devkitppc:$t >/dev/null 2>&1
        done
