name: Debug crash
on:
  push:
    branches: [debug-crash]
jobs:
  sym:
    strategy:
      matrix:
        rev: [4ab59ac, 4e07d94]
    runs-on: ubuntu-latest
    container: ghcr.io/extremscorner/libogc2:latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - run: |
        git config --global --add safe.directory "$PWD"
        git checkout -q ${{ matrix.rev }}
        make -f Makefile -j2 >build.log 2>&1 || { tail -30 build.log; exit 1; }
        elf=$(find . -name 'wiimc.elf' | head -1)
        echo "ELF=$elf"
        $DEVKITPPC/bin/powerpc-eabi-addr2line -afipC -e $elf 8077156c 8076801c 8006266c 80026ba4 8001eab8 80044594 800461cc 8001d4d0 8001da80
        $DEVKITPPC/bin/powerpc-eabi-nm -nC $elf | awk '$1<="8077156c"{a=$0} END{print "antes:",a}'
