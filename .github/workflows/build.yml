name: Debug crash
on:
  push:
    branches: [debug-crash]
jobs:
  check:
    runs-on: ubuntu-latest
    container: ghcr.io/extremscorner/libogc2:latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - run: |
        git config --global --add safe.directory "$PWD"
        git checkout -q bcbbaa9
        make -f Makefile -j2 >build.log 2>&1 || { tail -30 build.log; exit 1; }
        $DEVKITPPC/bin/powerpc-eabi-objdump -d executables/wiimc.elf |
          awk '/^[0-9a-f]+ <.*>:$/{f=$2} /\tbl? / && /(create_mspace_with_base|__wrap_mspace_malloc)/{print "CHAMADA", f, $NF}'
