name: tmp probe
on: [push]
jobs:
  d:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ["20180522", "20190212"]
    steps:
    - uses: actions/checkout@v4
    - run: docker run --rm -v "$PWD":/src -w /src devkitpro/devkitppc:${{ matrix.tag }} bash tools/probe.sh
