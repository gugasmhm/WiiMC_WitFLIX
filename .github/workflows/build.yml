name: Probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    container: ghcr.io/extremscorner/libogc2:latest
    steps:
    - run: |
        echo $DEVKITPRO
        ls $DEVKITPRO $DEVKITPRO/portlibs/* $DEVKITPRO/portlibs/*/lib $DEVKITPRO/portlibs/*/include $DEVKITPRO/libogc2/include $DEVKITPRO/libogc2/lib/wii || true
        (dkp-pacman -Q || pacman -Q) 2>/dev/null || true
        (dkp-pacman -Ss tls || pacman -Ss tls) 2>/dev/null || true
        find $DEVKITPRO -iname '*mbedtls*' -o -iname '*wolfssl*' | head -30
        grep -rnE 'net_recv|net_send|net_gethostbyname|ES_|TRNG|STM_|gettime' $DEVKITPRO/libogc2/include/network.h | head
