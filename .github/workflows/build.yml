name: Sonda paired singles
on:
  push:
    branches: [debug-crash]
jobs:
  sonda:
    runs-on: ubuntu-latest
    container: ghcr.io/extremscorner/libogc2:latest
    steps:
    - run: |
        CC=$DEVKITPPC/bin/powerpc-eabi-gcc
        $CC --version | head -1
        printf '%s\n' 'typedef float v __attribute__((vector_size(8)));' 'v f(v a, v b, v c){ return __builtin_paired_madds0(a,b,c); }' > /tmp/p.c
        for flags in "-mcpu=750 -mpaired" "-mcpu=750 -mrvl -mpaired" "-mcpu=gekko" "-mcpu=broadway"; do
          echo "SONDA [$flags]"
          $CC $flags -mhard-float -O2 -S /tmp/p.c -o /tmp/p.s 2>&1 | head -3 | sed 's/^/SONDA   /'
          grep -E 'ps_|bl ' /tmp/p.s 2>/dev/null | head -3 | sed 's/^/SONDA   asm /'; rm -f /tmp/p.s
        done
        find $DEVKITPPC -name paired.h | sed 's/^/SONDA header /'
        $CC -mcpu=750 -mrvl -dM -E - </dev/null | grep -iE 'paired|gekko|broadway|HW_' | sed 's/^/SONDA def /'
