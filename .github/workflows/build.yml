name: tmp emu
on: [push]
jobs:
  dol:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/extremscorner/libogc2:latest
    steps:
    - uses: actions/checkout@v4
    - run: cd tools/emu && make hello.dol
    - uses: actions/upload-artifact@v4
      with: {name: dol, path: tools/emu/hello.dol}
  run:
    needs: dol
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with: {name: dol}
    - run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq dolphin-emu >/dev/null; dpkg -l dolphin-emu | tail -1
        bash tools/emu/run.sh hello.dol 40
