name: WiiMC Build

on: [push, pull_request]

jobs:
  paired:
    name: Paired singles (GCC antigo)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout wiimc repo
      uses: actions/checkout@v4

    - name: Test chroma routine against reference
      run: |
        cc -O2 -Wall -Werror -o t_chroma tools/tests/test_h264chroma.c source/mplayer/ffmpeg/libavcodec/ppc/h264chroma_swar.c
        ./t_chroma

    - name: Build accelerated objects
      run: |
        docker run --rm -v "$PWD":/src -w /src devkitpro/devkitppc:20190212 bash tools/build-paired.sh

    - name: Upload accelerated objects
      uses: actions/upload-artifact@v4
      with:
        name: paired-objs
        path: paired-objs.tar

  build:
    name: Build
    needs: [paired]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["Wii"]
    container: ghcr.io/extremscorner/libogc2:latest

    steps:
    - name: Checkout wiimc repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download accelerated objects
      uses: actions/download-artifact@v4
      with:
        name: paired-objs

    - name: Unpack accelerated objects
      run: |
        tar -xf paired-objs.tar
        tar -tf paired-objs.tar | xargs touch

    - name: Build Wii
      if: ${{ matrix.image == 'Wii' }}
      run: |
        make -f Makefile -j1

    - name: Check acceleration is linked in
      run: |
        ELF=$(find . -name '*.elf' | head -1)
        echo "ELF: $ELF"
        $DEVKITPPC/bin/powerpc-eabi-nm "$ELF" | grep -E ' [Tt] .*(_paired|ff_h264_pred_init_ppc|ff_vc1dsp_init_ppc)' | head -40
        n=$($DEVKITPPC/bin/powerpc-eabi-objdump -d "$ELF" | grep -cE '\s(ps_|psq_)')
        echo "instrucoes paired singles no executavel: $n"
        for f in ff_dsputil_init_paired ff_float_init_paired ff_fft_init_paired ff_imdct_half_paired witflix_put_h264_chroma_mc8 witflix_avg_h264_chroma_mc4; do
          $DEVKITPPC/bin/powerpc-eabi-nm "$ELF" | grep -q "$f" && echo "ok $f" || echo "AUSENTE $f"
        done

    - name: Copy Wii artifacts
      if: ${{ matrix.image == 'Wii' }}
      run: |
        mkdir -p dist/WiiMC/apps/wiimc
        cp hbc/* dist/WiiMC/apps/wiimc/
        cp executables/wiimc.dol dist/WiiMC/apps/wiimc/boot.dol

    - name: Upload Wii artifacts
      uses: actions/upload-artifact@v4
      if: ${{ matrix.image == 'Wii' }}
      with:
        name: WiiMC
        path: |
          dist/WiiMC/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout wiimc repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        name: WiiMC
        path: dist/WiiMC

    - name: Re-zip artifacts
      run: |
        cd dist
        cd WiiMC
        zip -r ../WiiMC.zip *

    - name: Update Git Tag
      run: |
        git tag -f Pre-release
        git push -f origin Pre-release

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        prerelease: true
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: false
        tag: Pre-release
        artifacts: "dist/*.zip"
